services:
  - type: web
    name: ai-job-hunter-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/jobs.db
      - key: OLLAMA_URL
        value: ""
